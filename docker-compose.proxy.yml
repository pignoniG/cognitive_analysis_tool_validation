# Add the container to the network of an existing reverse proxy (nginx in Docker), so the proxy can reach it as
# http://validation:8000 without publishing anything:
#
#     PROXY_NETWORK=<network> docker compose -f docker-compose.yml -f docker-compose.proxy.yml up -d --build
#
# Then add deploy/nginx-validation.conf to that nginx (docs/deploying.md).

services:
  validation:
    networks:
      - default
      - proxy

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:?set PROXY_NETWORK to the name of the proxy's Docker network (docker network ls)}
