# A location block for an nginx that already serves a site over HTTPS (for example the one that serves the datavis on
# https://137-204-97-86.sslip.io): it puts the validation task under /validation/ on the same host name and
# certificate. Put it where that nginx reads its location snippets (e.g. /etc/nginx/segment.d/validation.conf) and
# make sure the nginx container is on the same Docker network as the `validation-task` container
# (docker-compose.proxy.yml). Then:  nginx -t && nginx -s reload
# On the UC4 server the snippet is mounted by deploy/docker-compose.uc4-nginx.yml (docs/deploying.md).
#
# Check the names against your own files first: this was written without sight of the server.

location = /validation { return 301 /validation/; }

location /validation/ {
    # the task's own password would cross the network in the clear over plain HTTP (the 8080 port)
    if ($scheme != https) {
        return 403 "The validation task is only available over HTTPS.\n";
    }

    # Docker's DNS, looked up at request time, so nginx starts even when the container is down
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $validation_upstream http://validation-task:8000;

    # strip the prefix (with a variable in proxy_pass, a URI in the directive would replace the whole path)
    rewrite ^/validation/(.*)$ /$1 break;
    proxy_pass $validation_upstream;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    client_max_body_size 20m;       # the largest single save the page sends
    proxy_read_timeout 60s;
}
